name: dind-symfony-postgres

services:
  db:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?generate infra/.env first}
      POSTGRES_USER: ${POSTGRES_USER:?generate infra/.env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate infra/.env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?generate infra/.env first}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "/app/docker-healthcheck.php"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    command:
      - sh
      - -ec
      - php bin/console doctrine:migrations:migrate --no-interaction && exec php -S 0.0.0.0:8000 -t public public/index.php

networks:
  private:
    name: dind-symfony-postgres-private
    internal: true

volumes:
  postgres_data:
    name: dind-symfony-postgres-data
