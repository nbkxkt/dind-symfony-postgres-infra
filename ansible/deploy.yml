---
- name: Deploy the Symfony and PostgreSQL demo in the nested Docker engine
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    demo_root: /opt/dind-symfony-postgres
    compose_args:
      - docker
      - compose
      - --project-name
      - dind-symfony-postgres
      - --env-file
      - infra/.env
      - -f
      - infra/compose.yaml
  tasks:
    - name: Check that both public repositories were cloned inside the DIND
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ demo_root }}/app/composer.json"
        - "{{ demo_root }}/infra/compose.yaml"
      register: checkout_files

    - name: Require the application and infrastructure files
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing {{ item.item }} inside the DIND checkout."
      loop: "{{ checkout_files.results }}"

    - name: Require a private runtime environment file
      ansible.builtin.stat:
        path: "{{ demo_root }}/infra/.env"
      register: private_env

    - name: Refuse deployment without a private runtime environment
      ansible.builtin.assert:
        that:
          - private_env.stat.exists
          - private_env.stat.mode == '0600'
        fail_msg: "Generate infra/.env inside the DIND with scripts/create-env.sh first."

    - name: Validate the inner Compose configuration without printing interpolated secrets
      ansible.builtin.command:
        argv: "{{ compose_args + ['config', '--quiet'] }}"
      args:
        chdir: "{{ demo_root }}"
      changed_when: false

    - name: Build and start the nested containers, waiting for PostgreSQL health
      ansible.builtin.command:
        argv: "{{ compose_args + ['up', '--detach', '--build', '--wait'] }}"
      args:
        chdir: "{{ demo_root }}"
      register: compose_up
      changed_when: true

    - name: Verify the Symfony page can read PostgreSQL from inside the app container
      ansible.builtin.command:
        argv: "{{ compose_args + ['exec', '-T', 'app', 'php', '/app/docker-healthcheck.php'] }}"
      args:
        chdir: "{{ demo_root }}"
      changed_when: false
